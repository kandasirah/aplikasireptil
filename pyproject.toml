[project]
name = "reptil"
version = "0.1.1"
description = "REPTIL — Reliable Enterprise Platform for Technology, Integration & Logistics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "fpdf2>=2.7",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "celery>=5.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reptil"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Panggilan dependency FastAPI memang diletakkan di default argumen.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Form", "fastapi.File", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# DDL & header hasil autogenerate Alembic memang memakai gaya template bawaannya.
"migrations/versions/*.py" = ["E501", "UP035", "UP007", "I001", "RUF100"]
# Skrip operasional (seed/backfill): baris panjang & impor terlambat wajar di sini.
"scripts/*.py" = ["E501", "RUF100", "SIM113"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
